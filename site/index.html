<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>eSewa Analytics Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#0B0F14; --panel:#12171F; --panel-alt:#171D27;
    --border:#232B36; --border-soft:#1A2029;
    --text:#E7ECF2; --muted:#8B97A6; --faint:#586472;
    --accent:#2DD4BF; --accent-dim:rgba(45,212,191,0.14);
    --pos:#22C55E; --pos-dim:rgba(34,197,94,0.14);
    --neu:#F5B300; --neu-dim:rgba(245,179,0,0.14);
    --neg:#EF4444; --neg-dim:rgba(239,68,68,0.14);
    --ios:#7C8CF8; --android:#22C55E;
  }
  html[data-theme="light"]{
    --bg:#F4F6F8; --panel:#FFFFFF; --panel-alt:#F0F2F5;
    --border:#DEE3E9; --border-soft:#E8EBEF;
    --text:#161B22; --muted:#5B6472; --faint:#8A93A0;
    --accent:#0D9488; --accent-dim:rgba(13,148,136,0.10);
    --pos:#16A34A; --pos-dim:rgba(22,163,74,0.10);
    --neu:#B45309; --neu-dim:rgba(180,83,9,0.10);
    --neg:#DC2626; --neg-dim:rgba(220,38,38,0.10);
    --ios:#5B5FE0; --android:#16A34A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  .icon{display:inline-block;vertical-align:-2px;}
  .brand-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;color:var(--accent);margin-bottom:6px;}
  .brand-title{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;margin:0;}
  .dropzone{border:1.5px dashed var(--border);border-radius:14px;padding:44px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:border-color .15s ease,background .15s ease;background:var(--panel);}
  .dropzone.drag{border-color:var(--accent);background:var(--accent-dim);}
  .upload-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .upload-wrap{max-width:640px;width:100%;}
  .err-line{margin-top:14px;display:flex;gap:8px;align-items:flex-start;color:var(--neg);font-size:13.5px;}
  .header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 24px;background:rgba(11,15,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .logo-mark{width:34px;height:34px;border-radius:9px;background:var(--panel-alt);object-fit:contain;padding:4px;border:1px solid var(--border);}
  .filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .seg-group{display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:3px;}
  .seg-btn{border:none;border-radius:6px;padding:6px 11px;font-size:12.5px;cursor:pointer;transition:all .12s ease;font-family:'Inter',sans-serif;background:transparent;color:var(--muted);font-weight:500;}
  .seg-btn.active{background:var(--accent);color:#04211D;font-weight:700;}
  .date-range-group{display:flex;gap:8px;align-items:center;}
  .date-field{position:relative;display:flex;align-items:center;gap:4px;}
  .date-text-input{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:5px 8px;font-size:12.5px;font-family:'Inter',sans-serif;width:100px;}
  .date-text-input:focus{outline:none;border-color:var(--accent);}
  .date-cal-btn{display:flex;align-items:center;justify-content:center;width:30px;height:28px;background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:7px;cursor:pointer;flex-shrink:0;}
  .date-cal-btn:hover{border-color:var(--accent);color:var(--accent);}
  .cal-popover{position:absolute;top:calc(100% + 8px);left:0;z-index:50;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;box-shadow:0 12px 28px rgba(0,0,0,0.35);width:250px;}
  html[data-theme="light"] .cal-popover{box-shadow:0 12px 28px rgba(20,30,40,0.16);}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cal-month-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--text);}
  .cal-nav{background:transparent;border:1px solid var(--border);color:var(--muted);width:24px;height:24px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1;}
  .cal-nav:hover{border-color:var(--accent);color:var(--accent);}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--faint);margin-bottom:4px;font-family:'JetBrains Mono',monospace;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text);font-size:12px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;}
  .cal-day.muted{visibility:hidden;cursor:default;}
  .cal-day:hover:not(.muted){background:var(--accent-dim);color:var(--accent);}
  .cal-day.selected{background:var(--accent);color:var(--bg);font-weight:700;}
  .cal-day.today:not(.selected){border:1px solid var(--accent);}
  .reupload-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;}
  .reupload-btn:hover{border-color:var(--accent);color:var(--accent);}
  .theme-toggle{display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;cursor:pointer;}
  .theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
  .add-file-btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent-dim);border:1px dashed var(--accent);color:var(--accent);border-radius:100px;padding:4px 11px;font-size:11.5px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;}
  .add-file-btn:hover{background:var(--accent);color:var(--bg);}
  .chip-remove{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--faint);cursor:pointer;padding:0;margin-left:2px;}
  .chip-remove:hover{color:var(--neg);}
  main{max-width:1320px;margin:0 auto;padding:20px 24px 60px;}
  .file-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);color:var(--muted);font-size:11.5px;padding:4px 9px;border-radius:100px;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:border-color .12s ease,color .12s ease,background .12s ease;}
  .file-chip:hover{border-color:var(--accent);color:var(--accent);}
  .file-chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700;}
  .grid-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  .ticket{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px 12px;
    background-image:radial-gradient(circle at 0 50%, var(--bg) 5px, transparent 5.5px), radial-gradient(circle at 100% 50%, var(--bg) 5px, transparent 5.5px);
    background-position:left center, right center; background-repeat:no-repeat;}
  .ticket-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .ticket-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--faint);}
  .ticket-value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;line-height:1;}
  .ticket-sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border-soft);display:flex;gap:8px;align-items:center;font-size:11px;font-family:'JetBrains Mono',monospace;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .panel-title{font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:700;margin:0;}
  .panel-caption{font-size:12px;color:var(--faint);margin:8px 0 0;line-height:1.4;}
  .chart-wrap{position:relative;width:100%;height:260px;}
  .donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  .donut-center .val{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--text);line-height:1;}
  .donut-center .lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--faint);margin-top:3px;}
  .legend-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);}
  .legend-dot{width:9px;height:9px;border-radius:3px;}
  .legend-count{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text);}
  .row-2col{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px;}
  .row-3col{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-top:16px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;text-align:center;border:1px dashed var(--border);border-radius:14px;color:var(--muted);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--faint);font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;}
  td{padding:9px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);vertical-align:top;}
  .review-table tbody tr:hover td{background:var(--panel-alt);}
  .search-box{display:flex;align-items:center;gap:6px;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:6px 10px;}
  .search-box input{background:transparent;border:none;outline:none;color:var(--text);font-size:12.5px;font-family:'Inter',sans-serif;width:160px;}
  .select-box{background:var(--panel-alt);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 8px;font-size:12px;font-family:'Inter',sans-serif;}
  .sentiment-badge{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600;}
  .platform-tag{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  @media (max-width:1000px){ .grid-kpi{grid-template-columns:repeat(2,1fr);} .row-2col,.row-3col{grid-template-columns:1fr;} }
</style>
</head>

<script>

/* ======================= CONSTANTS ======================= */
const DARK_PALETTE = {
  pos:"#22C55E", posDim:"rgba(34,197,94,0.14)",
  neu:"#F5B300", neuDim:"rgba(245,179,0,0.14)",
  neg:"#EF4444", negDim:"rgba(239,68,68,0.14)",
  accent:"#2DD4BF", avgAccent:"#2DD4BF", muted:"#8B97A6", faint:"#586472",
  android:"#22C55E", ios:"#7C8CF8", number:"#E7ECF2",
};
const LIGHT_PALETTE = {
  pos:"#15803D", posDim:"rgba(21,128,61,0.10)",
  neu:"#92400E", neuDim:"rgba(146,64,14,0.10)",
  neg:"#B91C1C", negDim:"rgba(185,28,28,0.10)",
  accent:"#0F766E", avgAccent:"#0B0F14", muted:"#5B6472", faint:"#8A93A0",
  android:"#15803D", ios:"#3730A3", number:"#0B0F14",
};
function palette(){ return state.theme==="light" ? LIGHT_PALETTE : DARK_PALETTE; }
function sentMeta(){
  const p = palette();
  return {
    positive:{ label:"Positive", color:p.pos, dim:p.posDim },
    neutral:{ label:"Neutral", color:p.neu, dim:p.neuDim },
    negative:{ label:"Negative", color:p.neg, dim:p.negDim },
  };
}

const ISSUE_CATEGORIES = [
  { key:"kyc", label:"KYC / Verification Issues", keywords:["kyc","verify","verification","document","id card","citizenship","not verified","verification failed","profile update"] },
  { key:"txn", label:"Transaction Failures / Money Deducted", keywords:["deducted","money deducted","transaction fail","failed transaction","amount deducted","refund","not refunded","balance deducted","double charged","payment failed"] },
  { key:"bank", label:"Bank Transfer / Load Fund Errors", keywords:["bank transfer","load fund","top up","topup","add money","bank link","connect ipay","connectipay","load money","bank error"] },
  { key:"auth", label:"Login / OTP / Authentication Bugs", keywords:["otp","login","log in","password","authentication","pin","can't login","cannot login","sign in","mpin","fingerprint","face id"] },
  { key:"uiux", label:"UI / UX / Slow Performance", keywords:["slow","lag","crash","freeze","hang","loading","bug","glitch","ui","ux","interface","not responding","stuck"] },
  { key:"reward", label:"Cashback / Reward Points Queries", keywords:["cashback","reward","points","voucher","coupon","offer","bonus","referral"] },
  { key:"other", label:"Other / General Feedback", keywords:[] },
];

/* ======================= HELPERS ======================= */
function esc(s){ const d=document.createElement("div"); d.textContent = s==null? "" : String(s); return d.innerHTML; }
function normKey(k){ return String(k||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function getField(row, candidates){
  const keys = Object.keys(row);
  const normed = keys.map(k=>({orig:k, n:normKey(k)}));
  for(const c of candidates){ const nc=normKey(c); const hit=normed.find(k=>k.n===nc); if(hit) return row[hit.orig]; }
  for(const c of candidates){ const nc=normKey(c); const hit=normed.find(k=>k.n.includes(nc)||nc.includes(k.n)); if(hit) return row[hit.orig]; }
  return undefined;
}
function parseDateLoose(v){
  if(!v) return null;
  const s=String(v).trim();
  let d=new Date(s);
  if(!isNaN(d.getTime())) return d;
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){ const [,a,b,y]=m; const year=y.length===2?`20${y}`:y; d=new Date(`${year}-${b.padStart(2,"0")}-${a.padStart(2,"0")}`); if(!isNaN(d.getTime())) return d; }
  return null;
}
function detectPlatform(headers, filename){
  // 1) Filename is the most reliable signal when the user uploads separate per-platform exports.
  const fn = normKey(filename);
  const androidFileHints = ["android","googleplay","playstore","gplay","google"];
  const iosFileHints = ["ios","apple","appstore","itunes"];
  if(androidFileHints.some(h=>fn.includes(h)) && !iosFileHints.some(h=>fn.includes(h))) return "Android";
  if(iosFileHints.some(h=>fn.includes(h)) && !androidFileHints.some(h=>fn.includes(h))) return "iOS";

  // 2) Fall back to column-header signals (substring match, broadened list).
  const n=headers.map(normKey);
  const androidSignals=["packagename","reviewerlanguage","device","reviewlink","reviewsubmitdate","reviewsubmitmillis","reviewlastupdate","developerreply","appversioncode"];
  const iosSignals=["appstorereviewid","appversionstring","territory","voteup","votecount","votesum","reviewid"];
  const a=androidSignals.filter(s=>n.some(h=>h.includes(s)||s.includes(h))).length;
  const i=iosSignals.filter(s=>n.some(h=>h.includes(s)||s.includes(h))).length;
  if(a>i) return "Android"; if(i>a) return "iOS"; return "Unknown";
}
function categorize(text){
  const t=(text||"").toLowerCase();
  for(const c of ISSUE_CATEGORIES){ if(c.key==="other") continue; if(c.keywords.some(k=>t.includes(k))) return c.key; }
  return "other";
}
function sentimentOf(r){ return r>=4?"positive": r===3?"neutral":"negative"; }
function pad2(n){ return String(n).padStart(2,"0"); }
function isoDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function startOfWeek(d){ const nd=new Date(d); const day=(nd.getDay()+6)%7; nd.setDate(nd.getDate()-day); nd.setHours(0,0,0,0); return nd; }
function bucketKey(date, g){
  if(g==="daily") return isoDate(date);
  if(g==="weekly") return isoDate(startOfWeek(date));
  return `${date.getFullYear()}-${pad2(date.getMonth()+1)}`;
}
function bucketLabel(key, g){
  if(g==="monthly"){ const [y,m]=key.split("-"); const d=new Date(Number(y), Number(m)-1, 1); return d.toLocaleDateString(undefined,{month:"short",year:"2-digit"}); }
  const d=new Date(key);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function parseMDY(str){
  const m = String(str||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  const mo = Number(m[1]), da = Number(m[2]), yr = Number(m[3]);
  if(mo<1||mo>12||da<1||da>31) return null;
  const d = new Date(yr, mo-1, da);
  if(d.getMonth()!==mo-1 || d.getFullYear()!==yr) return null;
  return isoDate(d);
}
function formatMDY(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return `${pad2(d.getMonth()+1)}/${pad2(d.getDate())}/${d.getFullYear()}`;
}

/* ======================= FILE PROCESSING ======================= */
function parseOneFile(file){
  return new Promise((resolve)=>{
    Papa.parse(file, { header:true, skipEmptyLines:true, complete: res=>resolve(res), error: ()=>resolve(null) });
  });
}
function parseCsvText(text){
  return Papa.parse(text, { header:true, skipEmptyLines:true });
}
// Shared ingestion: turns a Papa.parse result + a label into dashboard rows.
// Used by both the local file-upload path and the GitHub auto-fetch path.
function rowsFromParsed(res, label){
  if(!res || !res.meta || !res.meta.fields || !res.meta.fields.length || !res.data.length) return null;
  const headers = res.meta.fields;
  const platform = detectPlatform(headers, label);
  const out = [];
  for(const row of res.data){
    const dateRaw = getField(row, ["date","review submit date and time","review date","timestamp","created date"]);
    const ratingRaw = getField(row, ["star rating","rating","stars","review rating"]);
    const text = getField(row, ["review text","body","review","comment","review body","title"]) || "";
    const version = getField(row, ["app version name","app version","version","app version string"]) || "";
    const date = parseDateLoose(dateRaw);
    const rating = Number(ratingRaw);
    if(!date || !rating || rating<1 || rating>5) continue;
    out.push({ date, rating, text:String(text).trim(), version:String(version).trim(), platform,
      sourceFile:label, sentiment:sentimentOf(rating), issue:categorize(text) });
  }
  return out;
}
async function handleFiles(fileList){
  const files = Array.from(fileList).filter(f=>f.name.toLowerCase().endsWith(".csv"));
  if(!files.length) return;
  state.error = "";
  const newRows = [];
  for(const file of files){
    const res = await parseOneFile(file);
    const parsed = rowsFromParsed(res, file.name);
    if(parsed===null){
      state.error = `Couldn't read "${file.name}". Make sure it's a valid CSV export.`;
      continue;
    }
    newRows.push(...parsed);
  }
  if(newRows.length){
    state.rows = state.rows.concat(newRows);
    state.sourceFiles = state.sourceFiles.concat(files.map(f=>f.name));
  } else if(!state.error){
    state.error = "No valid review rows found. Check that the CSV has date, rating, and review columns.";
  }
  render();
}

/* ======================= GITHUB AUTO-SYNC =======================
   Fills the dashboard straight from the CSVs your GitHub Action commits
   every day — no manual upload needed. Point this at your repo. */
const GITHUB_CONFIG = {
  owner: "YOUR_GITHUB_USERNAME",     // <-- change this
  repo: "esewa-review-pipeline",     // <-- change this (repo name)
  branch: "main",
};
function githubRawUrl(path){
  // cache-bust so a page refresh always gets the latest committed CSV,
  // rather than a stale cached copy of raw.githubusercontent.com
  return `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${path}?t=${Date.now()}`;
}
async function fetchJson(url){
  try{
    const resp = await fetch(url, { cache:"no-store" });
    if(!resp.ok) return null;
    return await resp.json();
  }catch(e){ return null; }
}
async function fetchText(url){
  try{
    const resp = await fetch(url, { cache:"no-store" });
    if(!resp.ok) return null;
    return await resp.text();
  }catch(e){ return null; }
}
// Loads every monthly CSV listed in data/manifest.json (or just the most
// recent `limit` months, for speed). Returns true if anything loaded.
async function syncFromGitHub({ full=false } = {}){
  const manifest = await fetchJson(githubRawUrl("data/manifest.json"));
  if(!manifest || !Array.isArray(manifest.monthly_files) || !manifest.monthly_files.length) return false;

  const monthly = full ? manifest.monthly_files : manifest.monthly_files.slice(-3);
  const newRows = [];
  const loadedFiles = [];
  for(const relPath of monthly){
    const text = await fetchText(githubRawUrl(`data/${relPath}`));
    if(!text) continue;
    const label = `GitHub: ${relPath}`;
    const parsed = rowsFromParsed(parseCsvText(text), label);
    if(parsed && parsed.length){
      newRows.push(...parsed);
      loadedFiles.push(label);
    }
  }
  if(!newRows.length) return false;

  // Replace rather than append, so re-syncing never double-counts.
  state.rows = state.rows.filter(r=>!String(r.sourceFile).startsWith("GitHub: ")).concat(newRows);
  state.sourceFiles = state.sourceFiles.filter(f=>!String(f).startsWith("GitHub: ")).concat(loadedFiles);
  state.error = "";
  return true;
}
async function handleSyncClick(full){
  state.syncing = true; render();
  const ok = await syncFromGitHub({ full });
  state.syncing = false;
  if(!ok) state.error = "Couldn't sync from GitHub. Check GITHUB_CONFIG (owner/repo/branch) and that the Action has run at least once.";
  render();
}
function resetAll(){
  state.rows=[]; state.sourceFiles=[]; state.error=""; state.preset="30d";
  state.customStart=""; state.customEnd=""; state.search=""; state.ratingFilter="all"; state.categoryFilter="all"; state.sentimentFilter="all";
  state.activeFileFilter=null;

}
function removeFile(filename){
  state.rows = state.rows.filter(r=>r.sourceFile!==filename);
  const idx = state.sourceFiles.indexOf(filename);

}
function selectFileFilter(filename){

}

function ensureCalView(which){

function openDateField(which){

function navMonth(which, delta){

  month += delta;

  state.datePicker[key] = { year, month };

function pickDate(which, iso){

function calendarPopoverHtml(which){

/* ======================= DERIVED DATA ======================= */
function computeRange(){
  const now = new Date(); now.setHours(23,59,59,999);
  let start, end = now;
  if(state.preset==="today"){ start=new Date(now); start.setHours(0,0,0,0); }
  else if(state.preset==="7d"){ start=new Date(now); start.setDate(start.getDate()-6); start.setHours(0,0,0,0); }
  else if(state.preset==="30d"){ start=new Date(now); start.setDate(start.getDate()-29); start.setHours(0,0,0,0); }
  else if(state.preset==="custom" && state.customStart && state.customEnd){
    start=new Date(state.customStart); start.setHours(0,0,0,0);
    end=new Date(state.customEnd); end.setHours(23,59,59,999);
  } else {
    const scoped = state.activeFileFilter ? state.rows.filter(r=>r.sourceFile===state.activeFileFilter) : state.rows;
    const dates = scoped.map(r=>r.date.getTime());
    start = dates.length ? new Date(Math.min(...dates)) : new Date(0);
  }
  const span = end.getTime()-start.getTime();
  const prevStart = new Date(start.getTime()-span-86400000);
  const prevEnd = new Date(start.getTime()-86400000);
  return { start, end, prevStart, prevEnd };
}

function computeDerived(){
  const { start, end, prevStart, prevEnd } = computeRange();
  const sourceRows = state.activeFileFilter ? state.rows.filter(r=>r.sourceFile===state.activeFileFilter) : state.rows;
  const filtered = sourceRows.filter(r=>r.date>=start && r.date<=end);
  const prevFiltered = sourceRows.filter(r=>r.date>=prevStart && r.date<=prevEnd);

  const total = filtered.length;
  const avg = total ? filtered.reduce((s,r)=>s+r.rating,0)/total : 0;
  const prevAvg = prevFiltered.length ? prevFiltered.reduce((s,r)=>s+r.rating,0)/prevFiltered.length : 0;
  const trend = prevAvg ? ((avg-prevAvg)/prevAvg)*100 : 0;
  const pos = filtered.filter(r=>r.sentiment==="positive").length;
  const neu = filtered.filter(r=>r.sentiment==="neutral").length;
  const neg = filtered.filter(r=>r.sentiment==="negative").length;
  const android = filtered.filter(r=>r.platform==="Android").length;
  const ios = filtered.filter(r=>r.platform==="iOS").length;
  const kpis = { total, avg, trend, pos, neu, neg, android, ios };

  const spanDays = Math.max(1, Math.round((end.getTime()-start.getTime())/86400000));
  const granularity = spanDays<=45 ? "daily" : spanDays<=180 ? "weekly" : "monthly";

  const bMap = new Map();
  for(const r of filtered){
    const key = bucketKey(r.date, granularity);
    if(!bMap.has(key)) bMap.set(key,{key,sum:0,count:0});
    const b = bMap.get(key); b.sum+=r.rating; b.count+=1;
  }
  const trendData = Array.from(bMap.values()).sort((a,b)=>a.key>b.key?1:-1)
    .map(b=>({ label:bucketLabel(b.key,granularity), avgRating:Number((b.sum/b.count).toFixed(2)), volume:b.count }));

  const iMap = new Map(ISSUE_CATEGORIES.map(c=>[c.key,{key:c.key,label:c.label,count:0,ratingSum:0}]));
  for(const r of filtered){ const b=iMap.get(r.issue); if(b){ b.count+=1; b.ratingSum+=r.rating; } }
  const negTotal = filtered.filter(r=>r.sentiment==="negative").length || 1;
  const issueData = Array.from(iMap.values()).filter(b=>b.count>0).map(b=>({
    ...b, avgRating:Number((b.ratingSum/b.count).toFixed(2)),
    pctOfNegative:Number(((filtered.filter(r=>r.issue===b.key && r.sentiment==="negative").length/negTotal)*100).toFixed(1)),
  })).sort((a,b)=>b.count-a.count);

  const buildPlat = (plat)=>{
    const set = filtered.filter(r=>r.platform===plat);
    const a = set.length ? set.reduce((s,r)=>s+r.rating,0)/set.length : 0;
    const issues = set.filter(r=>r.sentiment!=="positive").length;
    return { platform:plat, avgRating:Number(a.toFixed(2)), reviews:set.length, issues };
  };
  const platformData = [buildPlat("Android"), buildPlat("iOS")];

  const tableRows = filtered
    .filter(r=> state.ratingFilter==="all" ? true : r.rating===Number(state.ratingFilter))
    .filter(r=> state.categoryFilter==="all" ? true : r.issue===state.categoryFilter)
    .filter(r=> state.sentimentFilter==="all" ? true : r.sentiment===state.sentimentFilter)
    .filter(r=> state.search ? r.text.toLowerCase().includes(state.search.toLowerCase()) : true)
    .sort((a,b)=>b.date-a.date).slice(0,250);

  return { filtered, kpis, trendData, issueData, platformData, tableRows };
}

          <div class="search-box">${ICO.search}<input id="searchInput" placeholder="Search keywords…" value="${esc(state.search)}" /></div>
          <select id="sentimentSelect" class="select-box">
            <option value="all" ${state.sentimentFilter==="all"?"selected":""}>All sentiments</option>
            <option value="positive" ${state.sentimentFilter==="positive"?"selected":""}>Positive</option>
            <option value="neutral" ${state.sentimentFilter==="neutral"?"selected":""}>Neutral</option>
            <option value="negative" ${state.sentimentFilter==="negative"?"selected":""}>Negative</option>
          </select>
          <select id="ratingSelect" class="select-box">
            <option value="all" ${state.ratingFilter==="all"?"selected":""}>All ratings</option>
            ${[5,4,3,2,1].map(n=>`<option value="${n}" ${state.ratingFilter==String(n)?"selected":""}>${n}★</option>`).join("")}
          </select>
          <select id="categorySelect" class="select-box">
            <option value="all" ${state.categoryFilter==="all"?"selected":""}>All categories</option>
            ${ISSUE_CATEGORIES.map(c=>`<option value="${c.key}" ${state.categoryFilter===c.key?"selected":""}>${esc(c.label)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="review-table"><thead><tr><th>Date</th><th>Platform</th><th>Rating</th><th>Category</th><th>Review</th><th>Sentiment</th></tr></thead>
        <tbody>
          ${tableRows.map(r=>{
            const cat = ISSUE_CATEGORIES.find(c=>c.key===r.issue);
            const sm = sentMeta()[r.sentiment];
            const platIcon = r.platform==="iOS"? ICO.apple : ICO.phone;
            const platColor = r.platform==="iOS"?palette().ios:(r.platform==="Android"?palette().android:palette().faint);
            return `<tr>
              <td style="white-space:nowrap;color:var(--faint)">${r.date.toLocaleDateString()}</td>
              <td style="white-space:nowrap;"><span class="platform-tag" style="color:${platColor}">${platIcon} ${r.platform}</span></td>
              <td>${"★".repeat(r.rating)}<span style="color:var(--border-soft)">${"★".repeat(5-r.rating)}</span></td>
              <td style="white-space:nowrap;color:var(--muted);font-size:12px;">${esc(cat?cat.label:"Other")}</td>
              <td style="max-width:360px;">${r.text? esc(r.text) : `<span style="color:var(--faint)">(no text)</span>`}</td>
              <td><span class="sentiment-badge" style="color:${sm.color};background:${sm.dim}">${sm.label}</span></td>
            </tr>`;
          }).join("")}
        </tbody></table>
        ${tableRows.length===0? `<div style="text-align:center;padding:30px;color:var(--faint);font-size:13.5px;">No reviews match these filters.</div>`:""}
      </div>
    </section>
  `;

function bindDashboardEvents(){
  document.querySelectorAll('[data-action="preset"]').forEach(b=>b.addEventListener("click", ()=>{ state.preset=b.dataset.val; render(); }));
  const reBtn = document.getElementById("reuploadBtn"); if(reBtn) reBtn.addEventListener("click", resetAll);
  const syncBtn = document.getElementById("syncLatestBtn"); if(syncBtn) syncBtn.addEventListener("click", ()=>handleSyncClick(false));
  const themeBtn = document.getElementById("themeToggleBtn"); if(themeBtn) themeBtn.addEventListener("click", toggleTheme);
  const addInput = document.getElementById("addFileInput");
  if(addInput) addInput.addEventListener("change", (e)=>{ handleFiles(e.target.files); e.target.value=""; });
  document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener("click", (e)=>{ e.preventDefault(); e.stopPropagation(); removeFile(b.dataset.remove); }));
  document.querySelectorAll('[data-select-file]').forEach(b=>b.addEventListener("click", ()=> selectFileFilter(b.dataset.selectFile || null)));
  document.querySelectorAll('[data-datefield]').forEach(b=>b.addEventListener("click", (e)=>{ e.stopPropagation(); openDateField(b.dataset.datefield); }));
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener("click", (e)=>{ e.stopPropagation(); navMonth(b.dataset.which, Number(b.dataset.nav)); }));
  document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener("click", (e)=>{ e.stopPropagation(); pickDate(b.dataset.which, b.dataset.pick); }));
  document.querySelectorAll(".date-text-input").forEach(inp=>{
    inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") inp.blur(); });
    inp.addEventListener("change", (e)=>{
      const which = inp.dataset.which;
      const iso = parseMDY(e.target.value);
      if(iso){ if(which==="start") state.customStart=iso; else state.customEnd=iso; }
      render();
    });
  });
  const si = document.getElementById("searchInput");
  if(si){ si.addEventListener("input", (e)=>{ state.search=e.target.value; renderTableOnly(); }); }
  const rs = document.getElementById("ratingSelect"); if(rs) rs.addEventListener("change", (e)=>{ state.ratingFilter=e.target.value; render(); });
  const cs = document.getElementById("categorySelect"); if(cs) cs.addEventListener("change", (e)=>{ state.categoryFilter=e.target.value; render(); });
  const ss = document.getElementById("sentimentSelect"); if(ss) ss.addEventListener("change", (e)=>{ state.sentimentFilter=e.target.value; render(); });
}

// lightweight re-render for the search box only, so charts aren't rebuilt on every keystroke
function renderTableOnly(){
  const { tableRows } = computeDerived();
  const tbody = document.querySelector(".review-table tbody");
  if(!tbody) return;
  tbody.innerHTML = tableRows.map(r=>{
    const cat = ISSUE_CATEGORIES.find(c=>c.key===r.issue);
    const sm = sentMeta()[r.sentiment];
    const platIcon = r.platform==="iOS"? ICO.apple : ICO.phone;
    const platColor = r.platform==="iOS"?palette().ios:(r.platform==="Android"?palette().android:palette().faint);
    return `<tr>
      <td style="white-space:nowrap;color:var(--faint)">${r.date.toLocaleDateString()}</td>
      <td style="white-space:nowrap;"><span class="platform-tag" style="color:${platColor}">${platIcon} ${r.platform}</span></td>
      <td>${"★".repeat(r.rating)}<span style="color:var(--border-soft)">${"★".repeat(5-r.rating)}</span></td>
      <td style="white-space:nowrap;color:var(--muted);font-size:12px;">${esc(cat?cat.label:"Other")}</td>
      <td style="max-width:360px;">${r.text? esc(r.text) : `<span style="color:var(--faint)">(no text)</span>`}</td>
      <td><span class="sentiment-badge" style="color:${sm.color};background:${sm.dim}">${sm.label}</span></td>
    </tr>`;
  }).join("");
}

/* ======================= CHARTS ======================= */
function buildTrendChart(trendData){
  const ctx = document.getElementById("trendChart");
  if(!ctx) return;
  const ct = chartTheme();
  chartInstances.trend = new Chart(ctx, {
    data:{
      labels: trendData.map(d=>d.label),
      datasets:[
        { type:"line", label:"Avg rating", data:trendData.map(d=>d.avgRating), borderColor:palette().accent,
          backgroundColor:"rgba(45,212,191,0.18)", fill:true, tension:.35, yAxisID:"y", pointRadius:2, borderWidth:2 },
        { type:"line", label:"Review volume", data:trendData.map(d=>d.volume), borderColor:ct.tick,
          borderDash:[4,3], fill:false, tension:.3, yAxisID:"y1", pointRadius:0, borderWidth:1.5 },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:"index", intersect:false },
      plugins:{ legend:{ labels:{ color:ct.legend, boxWidth:10, font:{size:11} } }, tooltip:{ backgroundColor:ct.tooltipBg, borderColor:ct.tooltipBorder, borderWidth:1 } },
      scales:{
        x:{ grid:{ color:ct.grid }, ticks:{ color:ct.tick, font:{size:10.5} } },
        y:{ min:0, max:5, position:"left", grid:{ color:ct.grid }, ticks:{ color:ct.tick, font:{size:10.5} } },
        y1:{ position:"right", grid:{ display:false }, ticks:{ color:ct.tick, font:{size:10.5} } },
      }
    }
  });
}

function buildDonutChart(kpis){
  const ctx = document.getElementById("donutChart");
  if(!ctx) return;
  const ct = chartTheme();
  const data = [kpis.pos, kpis.neu, kpis.neg];
  const labels = ["Positive","Neutral","Negative"];
  const colors = [palette().pos, palette().neu, palette().neg];
  chartInstances.donut = new Chart(ctx, {
    type:"doughnut",
    data:{ labels, datasets:[{ data, backgroundColor:colors, borderColor:ct.panelBg, borderWidth:3 }] },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:"68%",
      plugins:{ legend:{ display:false },
        tooltip:{ backgroundColor:ct.tooltipBg, borderColor:ct.tooltipBorder, borderWidth:1,
          callbacks:{ label:(c)=> `${c.label}: ${c.raw} review${c.raw===1?"":"s"}` } } }
    }
  });
}

function buildIssueChart(issueData){
  const ctx = document.getElementById("issueChart");
  if(!ctx) return;
  const ct = chartTheme();
  chartInstances.issue = new Chart(ctx, {
    type:"bar",
    data:{ labels: issueData.map(d=>d.label), datasets:[{ label:"Count", data: issueData.map(d=>d.count), backgroundColor:palette().accent, borderRadius:4 }] },
    options:{
      indexAxis:"y", responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false }, tooltip:{ backgroundColor:ct.tooltipBg, borderColor:ct.tooltipBorder, borderWidth:1 } },
      scales:{
        x:{ grid:{ color:ct.grid }, ticks:{ color:ct.tick, font:{size:10.5} } },
        y:{ grid:{ display:false }, ticks:{ color:ct.legend, font:{size:11} } },
      }
    }
  });
}

function buildPlatformChart(platformData){
  const ctx = document.getElementById("platformChart");
  if(!ctx) return;
  const ct = chartTheme();
  chartInstances.platform = new Chart(ctx, {
    type:"bar",
    data:{
      labels: platformData.map(d=>d.platform),
      datasets:[
        { label:"Avg rating", data: platformData.map(d=>d.avgRating), backgroundColor:palette().android, borderRadius:4 },
        { label:"Issue reports", data: platformData.map(d=>d.issues), backgroundColor:palette().ios, borderRadius:4 },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ labels:{ color:ct.legend, boxWidth:10, font:{size:11} } }, tooltip:{ backgroundColor:ct.tooltipBg, borderColor:ct.tooltipBorder, borderWidth:1 } },
      scales:{
        x:{ grid:{ display:false }, ticks:{ color:ct.legend, font:{size:12} } },
        y:{ grid:{ color:ct.grid }, ticks:{ color:ct.tick, font:{size:10.5} } },
      }
    }
  });
}

/* ======================= MAIN RENDER ROUTER ======================= */
function render(){
  if(state.rows.length===0) renderUploadScreen();
  else renderDashboard();
}

document.addEventListener("click", (e)=>{
  if(state.datePicker.open && !e.target.closest(".date-field")){
    state.datePicker.open = null;
    render();
  }
});

// On first load, try a silent auto-sync from GitHub (recent months only).
// If it fails (repo not configured yet, Action hasn't run, offline, etc.)
// we just fall through to the normal drag-and-drop upload screen.
(async function initialLoad(){
  render(); // show something immediately instead of a blank page
  if(state.rows.length===0){
    const ok = await syncFromGitHub({ full:false });
    if(ok) render();
  }
})();
</script>
